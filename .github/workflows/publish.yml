name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  push_to_registry:
    name: Push Docker image to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
      - id: lowercase_gh_repo
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}
        
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lowercase_gh_repo.outputs.lowercase }}/mds-connector-ui
          labels: |
            org.opencontainers.image.title=MDS EDC UI
            org.opencontainers.image.description=MDS EDC UI for MDS EDC Connector.
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image with metadata
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.tags }}
