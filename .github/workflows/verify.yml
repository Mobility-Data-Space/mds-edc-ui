name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      edc-1:
        image: ghcr.io/mobility-data-space/mds-edc/connector-inmemory:1.0.0-rc.7
        ports:
          - 8181:8181
          - 8186:8186
          - 8182:8182
          - 8183:8183
          - 8184:8184
          - 8185:8185
        options: --health-cmd="curl -f http://0.0.0.0:8181/api/check/liveness || exit 1" --health-interval=10s --health-retries=3
      edc-2:
        image: ghcr.io/mobility-data-space/mds-edc/connector-inmemory:1.0.0-rc.7
        ports:
          - 9181:8181
          - 9186:8186
          - 9182:8182
          - 9183:9183
          - 9184:9184
          - 9185:9185
        options: --health-cmd="curl -f http://0.0.0.0:8181/api/check/liveness || exit 1" --health-interval=10s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps chromium
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Run Playwright tests
      env:
        CI: true
      run: yarn playwright test
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Build
      run: yarn build
