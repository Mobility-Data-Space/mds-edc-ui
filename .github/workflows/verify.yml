name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setup .yarnrc.yml
      run: |
        yarn config set npmScopes.think-it-labs.npmRegistryServer "https://npm.pkg.github.com"
        yarn config set npmScopes.think-it-labs.npmAlwaysAuth true
        yarn config set npmScopes.think-it-labs.npmAuthToken $NPM_AUTH_TOKEN
      env:
        NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build
      run: yarn build
