name: Verify (Test and Build)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mds-edc-ui

jobs:
  # Setup job - Build custom test image once and pull Playwright image
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      test-image: ${{ steps.set-image.outputs.image }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set lowercase image name
      id: set-image
      run: |
        REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "image=${{ env.REGISTRY }}/$REPO_OWNER_LOWER/mds-edc-ui-test:${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "image-latest=${{ env.REGISTRY }}/$REPO_OWNER_LOWER/mds-edc-ui-test:latest" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create custom test Dockerfile
      run: |
        cat > Dockerfile.test << 'EOF'
        FROM mcr.microsoft.com/playwright:v1.54.2-jammy
        WORKDIR /app
        COPY package.json yarn.lock ./
        RUN yarn install --frozen-lockfile --prefer-offline
        COPY . .
        ENV CI=true
        CMD ["yarn", "playwright", "test"]
        EOF

    - name: Build and push custom test image
      run: |
        docker buildx build \
          --platform linux/amd64 \
          --file Dockerfile.test \
          --tag ${{ steps.set-image.outputs.image }} \
          --tag ${{ steps.set-image.outputs.image-latest }} \
          --push \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          .

    - name: Pre-pull and cache images for test jobs
      run: |
        # Pull Playwright base image
        docker pull mcr.microsoft.com/playwright:v1.54.2-jammy
        # Pull the test image we just built to ensure it's cached
        docker pull ${{ steps.set-image.outputs.image }}

  # Test Phase - Run tests in parallel using matrix strategy
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-group:
          - name: "dashboard"
            tests: "tests/dashboard.spec.ts"
          - name: "assets"
            tests: "tests/assets.spec.ts"
          - name: "policies"
            tests: "tests/policies.spec.ts"
          - name: "data-offers"
            tests: "tests/data-offer.spec.ts tests/create-data-offer.spec.ts"
          - name: "contracts"
            tests: "tests/contract-agreements.spec.ts tests/contract-negotiations.spec.ts"
          - name: "transfer-catalog"
            tests: "tests/transfer-process.spec.ts tests/catalog-browser.spec.ts tests/manual-approval.spec.ts"

    services:
      edc-1:
        image: ghcr.io/mobility-data-space/mds-edc/connector-inmemory:latest
        ports:
          - 8181:8181
          - 8186:8186
          - 8182:8182
          - 8183:8183
          - 8184:8184
          - 8185:8185
        env:
          EDC_PARTICIPANT_ID: "MDSXXXXXXX.YYYYYYY"
          EDC_COMPONENT_ID: "participant_1"
          WEB_HTTP_PATH: "/api"
          WEB_HTTP_PORT: "8181"
          WEB_HTTP_CONTROL_PATH: "/api/control"
          WEB_HTTP_CONTROL_PORT: "8186"
          WEB_HTTP_MANAGEMENT_PATH: "/api/management"
          WEB_HTTP_MANAGEMENT_PORT: "8182"
          WEB_HTTP_MANAGEMENT_AUTH_TYPE: "tokenbased"
          WEB_HTTP_MANAGEMENT_AUTH_KEY: "${{ secrets.TEST_API_KEY }}"
          WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
          WEB_HTTP_PROTOCOL_PORT: "8183"
          WEB_HTTP_VERSION_PATH: "/api/version"
          WEB_HTTP_VERSION_PORT: "8184"
          WEB_HTTP_PUBLIC_PATH: "/public"
          WEB_HTTP_PUBLIC_PORT: "8185"
          EDC_DSP_CALLBACK_ADDRESS: "http://edc-1:8183/api/dsp"
          EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "transfer-proxy-token-signer-public-key"
          EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "transfer-proxy-token-signer-private-key"
          EDC_LOGGINGHOUSE_EXTENSION_ENABLED: "false"

      edc-2:
        image: ghcr.io/mobility-data-space/mds-edc/connector-inmemory:latest
        ports:
          - 9181:8181
          - 9186:8186
          - 9182:8182
          - 9183:8183
          - 9184:8184
          - 9185:8185
        env:
          EDC_PARTICIPANT_ID: "MDSXXXXXXX.ZZZZZZZ"
          EDC_COMPONENT_ID: "participant_2"
          WEB_HTTP_PATH: "/api"
          WEB_HTTP_PORT: "8181"
          WEB_HTTP_CONTROL_PATH: "/api/control"
          WEB_HTTP_CONTROL_PORT: "8186"
          WEB_HTTP_MANAGEMENT_PATH: "/api/management"
          WEB_HTTP_MANAGEMENT_PORT: "8182"
          WEB_HTTP_MANAGEMENT_AUTH_TYPE: "tokenbased"
          WEB_HTTP_MANAGEMENT_AUTH_KEY: "${{ secrets.TEST_API_KEY }}"
          WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
          WEB_HTTP_PROTOCOL_PORT: "8183"
          WEB_HTTP_VERSION_PATH: "/api/version"
          WEB_HTTP_VERSION_PORT: "8184"
          WEB_HTTP_PUBLIC_PATH: "/public"
          WEB_HTTP_PUBLIC_PORT: "8185"
          EDC_DSP_CALLBACK_ADDRESS: "http://edc-2:8183/api/dsp"
          EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "transfer-proxy-token-signer-public-key"
          EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "transfer-proxy-token-signer-private-key"
          EDC_LOGGINGHOUSE_EXTENSION_ENABLED: "false"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Playwright tests for ${{ matrix.test-group.name }}
      run: |
        docker run --rm \
          --network host \
          -e TEST_API_KEY=${{ secrets.TEST_API_KEY }} \
          ${{ needs.setup.outputs.test-image }} \
          yarn playwright test ${{ matrix.test-group.tests }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.test-group.name }}
        path: playwright-report/
        retention-days: 30

  # Build Phase - Only runs if all tests pass
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build
      run: yarn build
