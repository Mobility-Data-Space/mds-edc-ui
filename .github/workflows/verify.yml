name: Verify (Test and Build)

# Pushes to main and tags are verified through publish.yml, which calls this workflow.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  # Gate - fast static checks; the e2e jobs do not start unless this passes
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  # Test Phase - Each identity stack (daps: in-memory connectors, dcp: wallets + issuer) runs
  # the e2e suite split into Playwright shards: 2 stacks x 4 shards = 8 runs
  test:
    name: test (${{ matrix.stack.name }}, shard ${{ matrix.shard }}/4)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - name: daps
            compose: docker-compose.e2e.yml
          - name: dcp
            compose: docker-compose.dcp.yml
        shard: [1, 2, 3, 4]
    env:
      TEST_API_KEY: ${{ secrets.TEST_API_KEY || 'default-test-api-key' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start ${{ matrix.stack.name }} stack
        run: docker compose -f ${{ matrix.stack.compose }} up -d --wait

      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/app \
            -w /app \
            -e CI=true \
            -e TEST_API_KEY \
            -e YARN_IGNORE_ENGINES=true \
            mcr.microsoft.com/playwright:v1.62.1-jammy@sha256:b3251f7ff1a9fa559a28d1c67eaa15fc1a9800f7845e82756caea7842967f615 \
            sh -c "yarn install --frozen-lockfile && yarn playwright test --shard=${{ matrix.shard }}/4"

      - name: Collect stack logs
        if: ${{ failure() }}
        run: docker compose -f ${{ matrix.stack.compose }} logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.stack.name }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            compose-logs.txt
          retention-days: 30

  # Build Phase - Runs alongside the tests once the gate passes
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
