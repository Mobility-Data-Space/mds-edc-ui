name: Verify (Test and Build)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      edc-1:
        image: ghcr.io/mobility-data-space/mds-edc/connector-inmemory:1.0.0-rc.7
        ports:
          - 8181:8181
          - 8186:8186
          - 8182:8182
          - 8183:8183
          - 8184:8184
          - 8185:8185
        env:
          EDC_PARTICIPANT_ID: "participant_1"
          EDC_COMPONENT_ID: "participant_1"
          EDC_HOSTNAME: "edc-participant-1"
          WEB_HTTP_PATH: "/api"
          WEB_HTTP_PORT: "8181"
          WEB_HTTP_CONTROL_PATH: "/api/control"
          WEB_HTTP_CONTROL_PORT: "8186"
          WEB_HTTP_MANAGEMENT_PATH: "/api/management"
          WEB_HTTP_MANAGEMENT_PORT: "8182"
          WEB_HTTP_MANAGEMENT_AUTH_TYPE: "tokenbased"
          WEB_HTTP_MANAGEMENT_AUTH_KEY: "my-test-api-key"
          WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
          WEB_HTTP_PROTOCOL_PORT: "8183"
          WEB_HTTP_VERSION_PATH: "/api/version"
          WEB_HTTP_VERSION_PORT: "8184"
          WEB_HTTP_PUBLIC_PATH: "/public"
          WEB_HTTP_PUBLIC_PORT: "8185"
          EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "transfer-proxy-token-signer-public-key"
          EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "transfer-proxy-token-signer-private-key"
          EDC_LOGGINGHOUSE_EXTENSION_ENABLED: "false"
      
      edc-2:
        image: ghcr.io/mobility-data-space/mds-edc/connector-inmemory:1.0.0-rc.7
        ports:
          - 9181:8181
          - 9186:8186
          - 9182:8182
          - 9183:8183
          - 9184:8184
          - 9185:8185
        env:
          EDC_PARTICIPANT_ID: "participant_2"
          EDC_COMPONENT_ID: "participant_2_MDS_COMPONENT"
          EDC_HOSTNAME: "edc-participant-2"
          WEB_HTTP_PATH: "/api"
          WEB_HTTP_PORT: "8181"
          WEB_HTTP_CONTROL_PATH: "/api/control"
          WEB_HTTP_CONTROL_PORT: "8186"
          WEB_HTTP_MANAGEMENT_PATH: "/api/management"
          WEB_HTTP_MANAGEMENT_PORT: "8182"
          WEB_HTTP_MANAGEMENT_AUTH_TYPE: "tokenbased"
          WEB_HTTP_MANAGEMENT_AUTH_KEY: "my-test-api-key"
          WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
          WEB_HTTP_PROTOCOL_PORT: "8183"
          WEB_HTTP_VERSION_PATH: "/api/version"
          WEB_HTTP_VERSION_PORT: "8184"
          WEB_HTTP_PUBLIC_PATH: "/public"
          WEB_HTTP_PUBLIC_PORT: "8185"
          EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "transfer-proxy-token-signer-public-key"
          EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "transfer-proxy-token-signer-private-key"
          EDC_LOGGINGHOUSE_EXTENSION_ENABLED: "false"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps chromium
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Run Playwright tests
      env:
        CI: true
      run: yarn playwright test
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Build
      run: yarn build
