name: mds-edc-ui-dcp

x-wallet: &wallet
  image: ghcr.io/mobility-data-space/mds-edc/wallet:${MDS_EDC_TAG:-latest}
  platform: linux/amd64
  depends_on:
    postgres:
      condition: service_healthy
    vault-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:7079/api/check/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

x-wallet-env: &wallet-env
  WEB_HTTP_PORT: "7079"
  WEB_HTTP_PATH: "/api"
  WEB_HTTP_CREDENTIALS_PORT: "7080"
  WEB_HTTP_CREDENTIALS_PATH: "/api/credentials"
  WEB_HTTP_IDENTITY_PORT: "7081"
  WEB_HTTP_IDENTITY_PATH: "/api/identity"
  WEB_HTTP_DID_PORT: "7083"
  WEB_HTTP_DID_PATH: "/"
  WEB_HTTP_STS_PORT: "7086"
  WEB_HTTP_STS_PATH: "/api/sts"

  EDC_IAM_DID_WEB_USE_HTTPS: "false"
  EDC_IDENTITYHUB_SUPERUSER_ID: "super-user"
  EDC_IDENTITYHUB_SUPERUSER_API_KEY: "c3VwZXItdXNlcg==.e2e-wallet-key"
  EDC_ENCRYPTION_STRICT: "false"
  EDC_SQL_SCHEMA_AUTOCREATE: "false"
  EU_DATASPACE_WALLET_POSTGRESQL_MIGRATION_SCHEMA: "public"

  EDC_VAULT_HASHICORP_URL: "http://vault:8200"
  EDC_VAULT_HASHICORP_TOKEN: "root"
  EDC_DATASOURCE_DEFAULT_USER: "edc"
  EDC_DATASOURCE_DEFAULT_PASSWORD: "password"

x-connector: &connector
  image: ghcr.io/mobility-data-space/mds-edc/connector-vault-postgresql-dcp:${MDS_EDC_TAG:-latest}
  platform: linux/amd64
  entrypoint: ["/app/bin/connector-vault-postgresql-dcp", "--log-level=debug"]
  depends_on:
    dcp-seed:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8181/api/check/liveness"]
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 30s

x-connector-env: &connector-env
  WEB_HTTP_PATH: "/api"
  WEB_HTTP_PORT: "8181"
  WEB_HTTP_CONTROL_PATH: "/api/control"
  WEB_HTTP_CONTROL_PORT: "8186"
  WEB_HTTP_MANAGEMENT_PATH: "/api/management"
  WEB_HTTP_MANAGEMENT_PORT: "8182"
  WEB_HTTP_MANAGEMENT_AUTH_TYPE: "tokenbased"
  WEB_HTTP_MANAGEMENT_AUTH_KEY: "${TEST_API_KEY:-default-test-api-key}"
  WEB_HTTP_PROTOCOL_PATH: "/api/dsp"
  WEB_HTTP_PROTOCOL_PORT: "8183"
  WEB_HTTP_VERSION_PATH: "/api/version"
  WEB_HTTP_VERSION_PORT: "8184"
  WEB_HTTP_PUBLIC_PATH: "/public"
  WEB_HTTP_PUBLIC_PORT: "8185"

  EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "transfer-proxy-token-signer-public-key"
  EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "transfer-proxy-token-signer-private-key"
  EDC_LOGGINGHOUSE_EXTENSION_ENABLED: "false"

  EDC_VAULT_HASHICORP_URL: "http://vault:8200"
  EDC_VAULT_HASHICORP_TOKEN: "root"
  EDC_DATASOURCE_DEFAULT_USER: "edc"
  EDC_DATASOURCE_DEFAULT_PASSWORD: "password"
  EDC_POSTGRESQL_MIGRATION_SCHEMA: "mds_edc_schema"

  # DCP
  EDC_IAM_DID_WEB_USE_HTTPS: "false"
  EDC_IAM_TRUSTEDISSUER_ISSUER_ID: "did:web:issuer%3A7085"
  EDC_IAM_TRUSTEDISSUER_ISSUER_SUPPORTEDTYPES: '["MembershipCredential"]'
  EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"

services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: password
    volumes:
      - ./docker/dcp/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    image: hashicorp/vault:1.18.4
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.18.4
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./docker/dcp/vault-init.sh:/vault-init.sh:ro
    entrypoint: ["sh", "/vault-init.sh"]

  issuer:
    image: ghcr.io/mobility-data-space/mds-identity-issuer/issuer:${MDS_ISSUER_TAG:-latest}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      WEB_HTTP_PORT: "7080"
      WEB_HTTP_PATH: "/api"
      WEB_HTTP_IDENTITY_PORT: "7081"
      WEB_HTTP_IDENTITY_PATH: "/api/identity"
      WEB_HTTP_ISSUANCE_PORT: "7082"
      WEB_HTTP_ISSUANCE_PATH: "/api/issuance"
      WEB_HTTP_ISSUERADMIN_PORT: "7083"
      WEB_HTTP_ISSUERADMIN_PATH: "/api/admin"
      WEB_HTTP_DID_PORT: "7085"
      WEB_HTTP_DID_PATH: "/"
      WEB_HTTP_STS_PORT: "7086"
      WEB_HTTP_STS_PATH: "/api/sts"
      WEB_HTTP_STATUSLIST_PORT: "7087"
      WEB_HTTP_STATUSLIST_PATH: "/statuslist"

      EDC_HOSTNAME: "issuer"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
      EDC_IDENTITYHUB_SUPERUSER_ID: "super-user"
      EDC_IDENTITYHUB_SUPERUSER_API_KEY: "c3VwZXItdXNlcg==.e2e-issuer-key"
      # Written and read by the issuer itself, so the ':' in the alias is fine.
      EDC_ISSUER_STATUSLIST_SIGNING_KEY_ALIAS: "did:web:issuer%3A7085#key-1"
      EDC_STATUSLIST_CALLBACK_ADDRESS: "http://issuer:7087/statuslist"
      EDC_ENCRYPTION_STRICT: "false"
      EDC_SQL_SCHEMA_AUTOCREATE: "false"

      EDC_VAULT_HASHICORP_URL: "http://vault:8200"
      EDC_VAULT_HASHICORP_TOKEN: "root"
      EDC_VAULT_HASHICORP_FOLDER: "issuer"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/issuer"
      EDC_DATASOURCE_DEFAULT_USER: "edc"
      EDC_DATASOURCE_DEFAULT_PASSWORD: "password"
    ports:
      - "19081:7081" # Identity
      - "19083:7083" # Issuer admin
      - "19085:7085" # DID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7080/api/check/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  wallet-1:
    <<: *wallet
    environment:
      <<: *wallet-env
      EDC_VAULT_HASHICORP_FOLDER: "wallet-1"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/wallet1"
    ports:
      - "17081:7081" # Identity
      - "17083:7083" # DID

  wallet-2:
    <<: *wallet
    environment:
      <<: *wallet-env
      EDC_VAULT_HASHICORP_FOLDER: "wallet-2"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/wallet2"
    ports:
      - "18081:7081" # Identity
      - "18083:7083" # DID

  dcp-seed:
    image: alpine:3.22
    depends_on:
      issuer:
        condition: service_healthy
      wallet-1:
        condition: service_healthy
      wallet-2:
        condition: service_healthy
    environment:
      ISSUER_API_VERSION: "${ISSUER_API_VERSION:-v1}"
    volumes:
      - ./docker/dcp:/dcp:ro
    entrypoint: ["sh", "/dcp/seed.sh"]

  edc-1:
    <<: *connector
    environment:
      <<: *connector-env
      EDC_PARTICIPANT_ID: "did:web:wallet-1%3A7083:edc-1"
      EDC_PARTICIPANT_CONTEXT_ID: "did:web:wallet-1%3A7083:edc-1"
      EDC_COMPONENT_ID: "participant_1_MDS_COMPONENT"
      EDC_IAM_ISSUER_ID: "did:web:wallet-1%3A7083:edc-1"
      EDC_IAM_STS_OAUTH_CLIENT_ID: "did:web:wallet-1%3A7083:edc-1"
      EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: "wallet-1-7083-edc-1-sts-client-secret"
      EDC_IAM_STS_OAUTH_TOKEN_URL: "http://wallet-1:7086/api/sts/token"
      EDC_DSP_CALLBACK_ADDRESS: "http://edc-1:8183/api/dsp"
      EDC_VAULT_HASHICORP_FOLDER: "edc-1"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/edc1?currentSchema=mds_edc_schema"
      # CORS (edc-1 only, as in docker-compose.e2e.yml)
      EDC_WEB_REST_CORS_ENABLED: "true"
      EDC_WEB_REST_CORS_HEADERS: "origin,content-type,accept,authorization,X-Api-Key"
      EDC_WEB_REST_CORS_ORIGINS: "*"
    ports:
      - "8181:8181" # API
      - "8186:8186" # Control
      - "8182:8182" # Management
      - "8183:8183" # Protocol
      - "8184:8184" # Version
      - "8185:8185" # Public

  edc-2:
    <<: *connector
    environment:
      <<: *connector-env
      EDC_PARTICIPANT_ID: "did:web:wallet-2%3A7083:edc-2"
      EDC_PARTICIPANT_CONTEXT_ID: "did:web:wallet-2%3A7083:edc-2"
      EDC_COMPONENT_ID: "participant_2_MDS_COMPONENT"
      EDC_IAM_ISSUER_ID: "did:web:wallet-2%3A7083:edc-2"
      EDC_IAM_STS_OAUTH_CLIENT_ID: "did:web:wallet-2%3A7083:edc-2"
      EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: "wallet-2-7083-edc-2-sts-client-secret"
      EDC_IAM_STS_OAUTH_TOKEN_URL: "http://wallet-2:7086/api/sts/token"
      EDC_DSP_CALLBACK_ADDRESS: "http://edc-2:8183/api/dsp"
      EDC_VAULT_HASHICORP_FOLDER: "edc-2"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://postgres:5432/edc2?currentSchema=mds_edc_schema"
    ports:
      - "9181:8181" # API
      - "9186:8186" # Control
      - "9182:8182" # Management
      - "9183:8183" # Protocol
      - "9184:8184" # Version
      - "9185:8185" # Public
